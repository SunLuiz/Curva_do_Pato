                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Applying Seasonal Mann-Kendall (period = 12) and deseasonalized Theil-Sen across 504 monthly NASA POWER observations (1984-2025), Petrolina-PE (-0.9647 %/dec cloud attenuation, p = 2.833e-09) and Manaus-AM (-0.8552 %/dec, p = 3.015e-08) brighten due to cloud reduction while clear-sky irradiance shows no trend. Campinas-SP shows flat clouds (p = 0.9476) and rising clear-sky irradiance (+0.1897 MJ/m2/day/dec, p < 1e-16), indicating an aerosol/clear-sky shift."
