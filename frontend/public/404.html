<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found · Cockpit-OMNI · Curve of Duck</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --surface-0: #FAF7F2;
        --surface-1: #FFFFFF;
        --hairline: #E4DCCF;
        --ink: #1C1B19;
        --ink-soft: #6B6760;
        --biome-se: #2A7047;
        --biome-n: #1F6F8B;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--surface-0);
        color: var(--ink);
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      .card {
        max-width: 620px;
        width: 100%;
        background: var(--surface-1);
        border: 1px solid var(--hairline);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 8px 28px rgba(28, 27, 25, 0.06);
      }
      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--biome-n);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 1.9rem;
        margin-top: 0.5rem;
      }
      p {
        color: var(--ink-soft);
        margin-top: 0.75rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1.4rem;
      }
      a {
        display: inline-block;
        padding: 0.55rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--hairline);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--ink);
        background: var(--surface-0);
      }
      a.primary {
        background: var(--biome-se);
        color: #FFFFFF;
        border-color: var(--biome-se);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">HTTP 404 · Cockpit-OMNI · Curve of Duck</div>
      <h1>Telemetry route not found</h1>
      <p>
        This path does not exist on <strong>www.curveofduck.xyz</strong>. Jump directly to one of our audited Earth observation and planetary physics views:
      </p>
      <nav class="links" aria-label="Recovery Navigation">
        <a class="primary" href="/">Story Overview</a>
        <a href="/cockpit">Earth System Cockpit</a>
        <a href="/game">3D Rover &amp; Academy</a>
        <a href="/science/">Science Articles</a>
        <a href="/llms.txt">llms.txt</a>
      </nav>
    </main>
  </body>
</html>
